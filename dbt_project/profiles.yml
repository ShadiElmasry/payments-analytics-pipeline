payments:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    # Default: zero-setup local warehouse (also what CI runs)
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4

    # Experimental: same models on Snowflake (see README, not covered by CI)
    snowflake:
      type: snowflake
      account:   "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user:      "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      password:  "{{ env_var('SNOWFLAKE_PASSWORD', 'unset') }}"
      role:      "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      database:  "{{ env_var('SNOWFLAKE_DATABASE', 'PAYMENTS_DB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'PAYMENTS_WH') }}"
      schema: ANALYTICS
      threads: 4
